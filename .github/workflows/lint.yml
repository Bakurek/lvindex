name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - name: import check
        run: |
          mkdir -p /tmp/proj && touch /tmp/proj/Demo.lvproj
          LVINDEX_PROJECT=/tmp/proj python -c "import sys; sys.path.insert(0, 'src'); import lvindex.query, lvindex.cli"

  tests:
    runs-on: windows-latest            # the tools are Windows-only (path handling)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -I -m unittest discover -s tests -v
