name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - name: import check
        run: |
          mkdir -p /tmp/proj && touch /tmp/proj/Demo.lvproj
          LVINDEX_PROJECT=/tmp/proj python -c "import sys; sys.path.insert(0, 'src'); import lvindex.query, lvindex.cli"
